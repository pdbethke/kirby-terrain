[project]
name = "kirby-terrain"
version = "0.1.0"
description = "Terrain objects, geometry and durability for the Kirby HERO System platform"
requires-python = ">=3.12"
license = {text = "PolyForm Noncommercial License 1.0.0"}
readme = "README.md"
authors = [{name = "PeterB"}]
# Zero dependencies, and that is the point: this package holds no rules and
# reads no database, so it can be tested in memory and cannot drift.
dependencies = []

[project.urls]
Repository = "https://github.com/pdbethke/kirby-terrain"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kirby_terrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
